# Fly.io config for the awp docs: Astro's Node server on :8080.
# Deployed by .github/workflows/deploy.yml on every push to main.
# Search needs the TypeSafe key: fly secrets set TYPESAFE_API_KEY=... -a awp-docs
app = "awp-docs"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
